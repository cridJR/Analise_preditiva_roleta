version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_db
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: api_analise
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: roleta_ui
    ports:
      - "3000:80"
    depends_on:
      - backend