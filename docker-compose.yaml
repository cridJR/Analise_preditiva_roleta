version: '3.8'

services:
  # Banco de dados em memória para alta performance (SRE)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # API de Análise
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

  # Interface do Usuário
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend